[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmlab"
version = "0.1.0"
description = "Evidence-linked sleep-time memory experiments with FalkorDB"
requires-python = ">=3.11"
dependencies = ["falkordb>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
swarmlab = "swarmlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
